# Production nginx for the web container (dev setup uses infra/nginx.conf).
# Serves the built SPA and forwards API traffic to the `api` service on the compose network.
# TLS is terminated in front of this (Coolify's Traefik), so this only listens on :80.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # OCR and document uploads
    client_max_body_size 25m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API routes are /api/v1/... in FastAPI, so the path is passed through unchanged
    # (no trailing slash on proxy_pass — that would strip the /api prefix).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;   # AI calls can take a while
    }

    location = /health {
        proxy_pass http://api:8000/health;
    }

    # Hashed build assets never change — cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/gl/journal, /ar/books, ...) all load index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
