# MeAccount — production / staging stack (deployed by Coolify, see docs/DEPLOY_ORACLE_COOLIFY.md).
#
# One copy of this file per environment: Coolify resource "production" tracks branch `main`,
# resource "staging" tracks `dev`. Each gets its own database volume and its own variables.
#
# Variables (set in Coolify → resource → Environment Variables; `:?` ones are required):
#   POSTGRES_PASSWORD      strong random password for the bundled PostgreSQL
#   SECRET_KEY             JWT signing key            — openssl rand -hex 32
#   FIELD_ENCRYPTION_KEY   PII encryption (Fernet)    — see docs/DEPLOYMENT.md
#   ANTHROPIC_API_KEY      optional; leave empty on staging so it can't spend real credits
#
# No host ports are published: Coolify's proxy routes the domain to `web:80`, and `web` proxies
# /api to `api:8000` on the internal network. Redis is not used by the code, so it isn't here.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: meaccount
      POSTGRES_USER: meaccount
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      TZ: Asia/Bangkok
      PGTZ: Asia/Bangkok
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meaccount -d meaccount"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: meaccount
      POSTGRES_USER: meaccount
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?set FIELD_ENCRYPTION_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # The browser reaches the API through web's /api proxy (same origin), so CORS stays closed.
      ALLOWED_ORIGINS: '[]'
      AUTO_CREATE_SCHEMA: "false"      # schema comes from `alembic upgrade head` in the entrypoint
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      TZ: Asia/Bangkok
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - "80"

volumes:
  pgdata:
